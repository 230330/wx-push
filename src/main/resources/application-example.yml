# ==========================================
# wx-push 配置模板
# 使用方式：复制为 application.yml 并填入真实值，
# 或通过环境变量注入（推荐）
# ==========================================

wx:
  config:
    # === 微信公众号配置 ===
    appId: "your_app_id"
    appSecret: "your_app_secret"
    # 微信服务器配置的 Token（公众号后台 -> 基本配置 -> 服务器配置）
    verifyToken: "your_verify_token"
    templateId: "your_template_id"
    openidList:
      - "openid_user1"
      - "openid_user2"
    # === 和风天气 QWeather API 配置（https://dev.qweather.com） ===
    # API Host：专属域名，登录控制台 -> 设置 中查看
    weatherApiHost: "pj5egpeqyt.re.qweatherapi.com"
    # 开发者ID（JWT 的 iss）：控制台 -> 设置，形如 Q96B30D7C0
    weatherDeveloperId: "Q96B30D7C0"
    # 项目ID（JWT 的 sub）：控制台 -> 项目管理
    weatherProjectId: "your_project_id"
    # 凭据ID（JWT 的 kid）：控制台 -> 项目管理 -> 凭据（创建 JWT 凭据后获得）
    weatherCredentialId: "your_credential_id"
    # Ed25519 私钥（PKCS8 PEM 文本或 Base64 编码）：
    # 1. 本地生成 Ed25519 密钥对（见 README 说明）
    # 2. 将公钥上传到控制台创建 JWT 凭据
    weatherPrivateKey: "your_private_key_pem_or_base64"
    # API KEY（可选）：控制台 -> 项目管理 -> 创建凭据时选择 API KEY 方式，
    # 配置后优先使用 API KEY 鉴权（请求头 X-QW-Api-Key），无需私钥
    weatherApiKey: ""
    city: "贵阳"
    # === 纪念日 & 生日配置 ===
    togetherDate: "2023-03-30"
    birthday1: "05-08"
    birthday1Name: "宝贝"
    birthday1Message: "🎂 生日快乐，小宝！愿你每天都开心，快乐！"
    birthday2: "06-08"
    birthday2Name: "自己"
    birthday2Message: "🎂 生日快乐！愿你心想事成，天天都有好心情！"
    message: "Have a nice day and love you everyday"
    enableDaily: false
    token: ""

server:
  port: 8081
